name: Build 察心智能 Windows installer

on:
  push:
    branches: [build/chaxin-windows]
  workflow_dispatch:
    inputs:
      build_version:
        description: '完整测试版本号；留空使用本次约定版本'
        type: string
        required: false
        default: '0.2.2-rc.1.20261109.1'

permissions:
  contents: read

concurrency:
  group: chaxin-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_VERSION: ${{ inputs.build_version || '0.2.2-rc.1.20261109.1' }}
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '3'
      DSH_RESOURCE_DOWNLOAD_TIMEOUT_MS: '600000'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure Windows build paths
        run: |
          git config --global core.longpaths true
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable native build symlink support' }
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select Python for native dependencies
        run: |
          $python = (Get-Command python).Source
          "PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Windows packaging prerequisites
        run: pnpm --dir apps/desktop run package:win:x64:unsigned --local --check --build-version "$env:PACKAGE_VERSION"
      - name: Build and verify Windows installer
        run: pnpm --dir apps/desktop run package:win:x64:unsigned --local --build-version "$env:PACKAGE_VERSION"
      - name: Collect installer and SHA-256
        run: |
          $files = @(Get-ChildItem 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts' -Filter '*.exe')
          if ($files.Count -ne 1) { throw "Expected one verified installer, found $($files.Count)" }
          New-Item -ItemType Directory -Force 'windows-installer' | Out-Null
          $name = "察心智能-$env:PACKAGE_VERSION-windows-x64-setup.exe"
          $destination = Join-Path 'windows-installer' $name
          Copy-Item -LiteralPath $files[0].FullName -Destination $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$destination.sha256" -Encoding utf8NoBOM
      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chaxin-windows-x64-installer
          path: windows-installer/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chaxin-windows-build-diagnostics
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 3
